{% if editable %}
<template id="new-issue-bar">
  <tr class="new-issue-bar"><td><button type="button" class="add-issue">+ Open an issue on <span class="range"></span></button></td></tr>
</template>
<template id="new-issue-template">
  <tr class="new-issue-row"><td>
    <form method="post" action="{{ create_action }}" class="new-issue">
      <input type="hidden" name="path">
      <input type="hidden" name="side">
      <input type="hidden" name="start_line">
      <input type="hidden" name="end_line">
      <input type="hidden" name="commit">
      <input type="hidden" name="merge_base">
      <input type="hidden" name="back">
      <p class="new-issue-title"></p>
      <div class="editor-tabs">
        <button type="button" class="active" data-tab="write">Write</button>
        <button type="button" data-tab="preview">Preview</button>
      </div>
      <textarea name="body" rows="6" required aria-label="Issue description" placeholder="Describe the issue (Markdown is supported)"></textarea>
      <div class="markdown preview" hidden></div>
      <div class="form-actions">
        <button type="submit">Create issue</button>
        <button type="button" class="secondary cancel">Cancel</button>
      </div>
    </form>
  </td></tr>
</template>
{% endif %}
<noscript><p class="hint">Selecting lines to open an issue needs JavaScript.</p></noscript>
