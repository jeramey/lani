[package]
name = "lani"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local Annotations, No Internet: a local code-review loop for Claude Code"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "form", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.56.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
jiff = "0.2.38"
lru = "0.18.5"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
syntect = { version = "5.3.0", default-features = false, features = ["html", "regex-onig"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "io-std", "net", "signal", "time", "sync"] }
toml = { version = "1.1.7", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
two-face = "0.5.2"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every fallible function returns the crate's single `Error` type, whose variants carry complete
# messages; per-function `# Errors` sections would restate that without adding information.
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
